
---
- name: Provision VM and MongoDB
  hosts: all
  become: true
  any_errors_fatal: true

  vars:
    mongodb_image: "docker.io/mongodb/mongodb-community-server:8.0.32-ubi9-slim"
    mongodb_container_name: "mongodb"
    mongodb_volume_name: "mongodb-data"
    mongodb_port: 27017

  pre_tasks:

    - name: Validate MongoDB credentials
      ansible.builtin.assert:
        that:
          - mongo_root_username is defined
          - mongo_root_username | length > 0
          - mongo_root_password is defined
          - mongo_root_password | length > 0
        fail_msg: "MongoDB username dan password wajib diisi melalui AAP Survey."
        quiet: true
      no_log: true

  tasks:

    - name: Install Podman
      ansible.builtin.dnf:
        name: podman
        state: present

    - name: Pull MongoDB Community image
      ansible.builtin.command:
        argv:
          - podman
          - pull
          - "{{ mongodb_image }}"
      changed_when: false

    - name: Check MongoDB persistent volume
      ansible.builtin.command:
        argv:
          - podman
          - volume
          - exists
          - "{{ mongodb_volume_name }}"
      register: mongodb_volume_exists
      changed_when: false
      failed_when: false

    - name: Create MongoDB persistent volume
      ansible.builtin.command:
        argv:
          - podman
          - volume
          - create
          - "{{ mongodb_volume_name }}"
      when: mongodb_volume_exists.rc != 0

    - name: Check existing MongoDB container
      ansible.builtin.command:
        argv:
          - podman
          - container
          - exists
          - "{{ mongodb_container_name }}"
      register: mongodb_exists
      changed_when: false
      failed_when: false

    - name: Remove old MongoDB container
      ansible.builtin.command:
        argv:
          - podman
          - rm
          - -f
          - "{{ mongodb_container_name }}"
      when: mongodb_exists.rc == 0

    - name: Run MongoDB Community container
      ansible.builtin.command:
        argv:
          - podman
          - run
          - -d
          - --name
          - "{{ mongodb_container_name }}"
          - --restart
          - always
          - -p
          - "{{ mongodb_port }}:27017"
          - -v
          - "{{ mongodb_volume_name }}:/data/db"
          - -e
          - "MONGO_INITDB_ROOT_USERNAME={{ mongo_root_username }}"
          - -e
          - "MONGO_INITDB_ROOT_PASSWORD={{ mongo_root_password }}"
          - "{{ mongodb_image }}"
      no_log: true

    - name: Enable Podman restart service
      ansible.builtin.systemd:
        name: podman-restart.service
        enabled: true
        state: started

    - name: Wait for MongoDB port
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ mongodb_port }}"
        delay: 2
        timeout: 60

    - name: Check MongoDB container status
      ansible.builtin.command:
        argv:
          - podman
          - inspect
          - "{{ mongodb_container_name }}"
          - --format
          - "{{ '{{' }}.State.Status{{ '}}' }}"
      register: mongodb_status
      changed_when: false

    - name: Validate MongoDB is running
      ansible.builtin.assert:
        that:
          - mongodb_status.stdout | trim == "running"
        fail_msg: "MongoDB container tidak dalam status running."
        success_msg: "MongoDB container is running."

    - name: Check MongoDB restart policy
      ansible.builtin.command:
        argv:
          - podman
          - inspect
          - "{{ mongodb_container_name }}"
          - --format
          - "{{ '{{' }}.HostConfig.RestartPolicy.Name{{ '}}' }}"
      register: mongodb_restart_policy
      changed_when: false

    - name: Validate MongoDB restart policy
      ansible.builtin.assert:
        that:
          - mongodb_restart_policy.stdout | trim == "always"
        fail_msg: "MongoDB restart policy bukan always."
        success_msg: "MongoDB restart policy is always."

    - name: Show MongoDB final status
      ansible.builtin.debug:
        msg:
          - "MongoDB status: {{ mongodb_status.stdout }}"
          - "MongoDB restart policy: {{ mongodb_restart_policy.stdout }}"
          - "MongoDB port: {{ mongodb_port }}"
